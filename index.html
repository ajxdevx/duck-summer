<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psyduck Summer</title>
  <link rel="stylesheet" href="assets/styles/styles.css">
</head>
<body>
  <div class="summer-cursor" aria-hidden="true">
    <div class="summer-cursor-seed summer-cursor-seed-1"></div>
    <div class="summer-cursor-seed summer-cursor-seed-2"></div>
    <div class="summer-cursor-seed summer-cursor-seed-3"></div>
  </div>
  <button class="wave-toggle" type="button" aria-pressed="false">Wave Sound: Off</button>
  <div class="container psy">
    <div class="psy-head">
      <div class="psy-face">
        <div class="psy-eye-wrap">
          <div class="psy-eye psy-eye-left"></div>
        </div>
        <div class="psy-eye-wrap">
          <div class="psy-eye psy-eye-right"></div>
        </div>
        <div class="psy-blush psy-blush-left"></div>
        <div class="psy-blush psy-blush-right"></div>
      </div>
      <div class="psy-beak">
        <div class="psy-beak-nose"></div>
      </div>
      <div class="psy-hair"></div>
    </div>
    <div class="psy-body">
      <div class="psy-arm psy-arm-left">
        <div class="psy-arm-claw"></div>
      </div>
      <div class="psy-arm psy-arm-right">
        <div class="psy-arm-claw"></div>
      </div>
      <div class="psy-tube psy-tube-front"></div>
      <div class="psy-tube psy-tube-back"></div>
      <div class="psy-torso"></div>
      <div class="psy-foot psy-foot-left">
        <div class="psy-foot-web"></div>
      </div>
      <div class="psy-foot psy-foot-right">
        <div class="psy-foot-web"></div>
      </div>
      <div class="water-magic"></div>
      <div class="water-ripple water-ripple-highlight"></div>
      <div class="water-ripple water-ripple-shadow"></div>
    </div>
    <div class="psy-thoughts psy-thoughts-1">
      <span class="psy-thoughts-symbol">?</span>
    </div>
    <div class="psy-thoughts psy-thoughts-2">
      <span class="psy-thoughts-symbol">?</span>
    </div>
  </div>
  <script>
    (function () {
      const supportsPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (!supportsPointer) return;

      document.body.classList.add('use-custom-cursor');
      const cursorEl = document.querySelector('.summer-cursor');
      if (!cursorEl) return;

      document.addEventListener('mousemove', (event) => {
        cursorEl.style.transform = `translate(${event.clientX}px, ${event.clientY}px)`;
      });
    })();

    (function () {
      const button = document.querySelector('.wave-toggle');
      if (!button) return;

      const audio = new Audio('assets/audio/beach-seagulls.mp3');
      audio.loop = true;
      audio.preload = 'auto';
      audio.volume = 0.5;

      let isPlaying = false;

      function updateButton() {
        button.textContent = isPlaying ? 'Wave Sound: On' : 'Wave Sound: Off';
        button.setAttribute('aria-pressed', String(isPlaying));
      }

      button.addEventListener('click', async () => {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        } else {
          try {
            await audio.play();
            isPlaying = true;
          } catch (_error) {
            isPlaying = false;
          }
        }
        updateButton();
      });
    })();
  </script>
</body>
</html>
